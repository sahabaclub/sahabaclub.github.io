<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Events">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#a78bfa"/><stop offset="55%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
<stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#e0a83e"/>
</linearGradient>
</defs>
<style>
.s{fill:none;stroke:url(#g);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.s2{fill:none;stroke:url(#g2);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.f{fill:url(#g)}
.f2{fill:url(#g2)}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.82)}50%{opacity:1;transform:scale(1.12)}}
@keyframes blink{0%,42%,100%{opacity:1}50%,58%{opacity:.12}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes flame{0%,100%{transform:scaleY(1);opacity:.95}50%{transform:scaleY(.6);opacity:.55}}
@keyframes ripple{0%{opacity:0;transform:scale(.55)}35%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes snap{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-3px)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="s" x="14" y="22" width="68" height="60" rx="9"/>
<path class="s" d="M14 40h68M32 12v16M64 12v16"/>
<g style="transform-origin:48px 60px;animation:twinkle 1.7s ease-in-out infinite">
<path class="f2" d="m48 48 4.4 9.6L62 62l-9.6 4.4L48 76l-4.4-9.6L34 62l9.6-4.4z"/>
</g>
</svg>
