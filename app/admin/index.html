<body class="admin">

<div class="ad-shell">
  <aside class="ad-side" id="ad-side"></aside>

  <main class="ad-main">
    <div class="ad-head">
      <h1>Overview</h1>
      <p id="ad-greeting">Loading…</p>
    </div>

    <div class="ad-stats" id="ad-stats"></div>

    <div class="ad-panel">
      <div class="ad-panel-head">
        <h2>Next events</h2>
        <div class="ad-spacer"></div>
        <a class="ad-btn ad-btn-sm" href="events.html">Manage events</a>
      </div>
      <div class="ad-tablewrap">
        <table class="ad-table" id="ad-upcoming">
          <thead>
            <tr>
              <th>Event</th>
              <th>Date</th>
              <th>Where</th>
              <th>Access</th>
            </tr>
          </thead>
          <tbody><tr><td colspan="4" class="ad-empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="ad-panel">
      <div class="ad-panel-head">
        <h2>Newest members</h2>
        <div class="ad-spacer"></div>
        <a class="ad-btn ad-btn-sm" href="members.html">All members</a>
      </div>
      <div class="ad-tablewrap">
        <table class="ad-table" id="ad-newest">
          <thead>
            <tr>
              <th>Name</th>
              <th>Joined</th>
              <th>Tier</th>
              <th>Profile</th>
            </tr>
          </thead>
          <tbody><tr><td colspan="4" class="ad-empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="ad-note"></div>
  </main>
</div>

<script type="module">
  import { supabase } from "../../lib/supabase-client.js?v=8917e84e6a";
  import { requireStaff, renderShell, escapeHtml, formatDate } from "../../lib/admin-guard.js?v=8917e84e6a";

  const user = await requireStaff("overview");
  if (user) {
    renderShell(user, "index.html");
    document.getElementById("ad-greeting").textContent =
      "Signed in as " + (user.fullName || user.email) + ".";
    load();
  }

  async function load() {
    // head:true with count gives a count without pulling the rows back.
    const [members, premium, events, upcomingCount, regs] = await Promise.all([
      supabase.from("profiles").select("user_id", { count: "exact", head: true }),
      supabase.from("subscriptions").select("user_id", { count: "exact", head: true }).eq("tier", "premium"),
      supabase.from("events").select("id", { count: "exact", head: true }),
      supabase.from("events").select("id", { count: "exact", head: true })
        .gte("event_date", new Date().toISOString().slice(0, 10)),
      supabase.from("event_registrations").select("id", { count: "exact", head: true }),
    ]);

    const stats = [
      { label: "Members", value: members.count ?? 0, sub: "total accounts" },
      { label: "Premium", value: premium.count ?? 0, sub: "paying members" },
      { label: "Upcoming events", value: upcomingCount.count ?? 0, sub: "of " + (events.count ?? 0) + " total" },
      { label: "Registrations", value: regs.count ?? 0, sub: "across all events" },
    ];

    document.getElementById("ad-stats").innerHTML = stats.map(s =>
      '<div class="ad-stat">' +
        '<div class="ad-stat-label">' + s.label + "</div>" +
        '<div class="ad-stat-value">' + s.value + "</div>" +
        '<div class="ad-stat-sub">' + s.sub + "</div>" +
      "</div>"
    ).join("");

    const { data: soon } = await supabase
      .from("events")
      .select("id, title, event_date, location, country, mode, tier_required, is_published")
      .gte("event_date", new Date().toISOString().slice(0, 10))
      .order("event_date", { ascending: true })
      .limit(6);

    const soonBody = document.querySelector("#ad-upcoming tbody");
    soonBody.innerHTML = (soon && soon.length) ? soon.map(e =>
      "<tr>" +
        '<td class="ad-cell-strong">' + escapeHtml(e.title) +
          (e.is_published ? "" : ' <span class="ad-pill muted">draft</span>') + "</td>" +
        "<td>" + formatDate(e.event_date) + "</td>" +
        '<td class="ad-cell-dim">' + escapeHtml(e.mode === "Online" ? "Online" : (e.location || e.country || "—")) + "</td>" +
        "<td>" + (e.tier_required === "premium"
          ? '<span class="ad-pill tier-premium">Premium</span>'
          : '<span class="ad-pill muted">Everyone</span>') + "</td>" +
      "</tr>"
    ).join("") : '<tr><td colspan="4" class="ad-empty">No upcoming events.</td></tr>';

    const { data: newest } = await supabase
      .from("profiles")
      .select("user_id, full_name, created_at, onboarding_completed_at, role")
      .order("created_at", { ascending: false })
      .limit(6);

    // Tiers come from a second table; fetch them in one go and join here
    // rather than issuing a query per member.
    let tiers = {};
    if (newest && newest.length) {
      const { data: subs } = await supabase
        .from("subscriptions")
        .select("user_id, tier")
        .in("user_id", newest.map(m => m.user_id));
      (subs || []).forEach(s => { tiers[s.user_id] = s.tier; });
    }

    const newBody = document.querySelector("#ad-newest tbody");
    newBody.innerHTML = (newest && newest.length) ? newest.map(m => {
      const tier = tiers[m.user_id] || "standard";
      return "<tr>" +
        '<td class="ad-cell-strong">' + escapeHtml(m.full_name || "(no name yet)") +
          (m.role !== "member" ? ' <span class="ad-pill role-' + m.role + '">' + m.role + "</span>" : "") + "</td>" +
        "<td>" + formatDate(m.created_at) + "</td>" +
        '<td><span class="ad-pill tier-' + tier + '">' + tier + "</span></td>" +
        "<td>" + (m.onboarding_completed_at
          ? '<span class="ad-pill ok">complete</span>'
          : '<span class="ad-pill warn">unfinished</span>') + "</td>" +
      "</tr>";
    }).join("") : '<tr><td colspan="4" class="ad-empty">No members yet.</td></tr>';

    renderMs365Note();
  }

  // What this used to be: one hardcoded sentence saying mailboxes and welcome
  // emails "are not yet automatic — they need the server functions deploying".
  // It was written when that was true and given no condition, so it went on
  // asserting it whatever the state of the tenant. A permanent warning tells
  // you nothing, and this one was the only thing on the dashboard claiming to
  // describe provisioning — so it could just as easily have been hiding a real
  // failure as reporting one.
  //
  // The two numbers that actually separate the cases are the mailbox count and
  // `credential_sent_at`, which provision-ms365 stamps only after
  // send-transactional-email accepts the message. A mailbox with no timestamp
  // is the case worth shouting about: the account exists in the tenant and its
  // password was generated, shown to nobody, and discarded.
  async function renderMs365Note() {
    const note = document.getElementById("ad-note");
    const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

    const [made, sent, unfinished] = await Promise.all([
      supabase.from("ms365_accounts").select("user_id", { count: "exact", head: true }),
      supabase.from("ms365_accounts").select("user_id", { count: "exact", head: true })
        .not("credential_sent_at", "is", null),
      supabase.from("profiles").select("user_id", { count: "exact", head: true })
        .is("onboarding_completed_at", null),
    ]);

    // Say we could not look rather than reporting a zero we did not measure —
    // "no mailboxes" and "no answer" are different findings.
    if (made.error || sent.error) {
      note.innerHTML = '<div class="ad-msg info">Couldn\'t read the Microsoft 365 state just now, ' +
        "so this panel can't tell you whether mailboxes and welcome emails are going out. " +
        "Reload; if it persists it's a permissions or connection problem, not an empty tenant.</div>";
      return;
    }

    const mailboxes = made.count ?? 0;
    const delivered = sent.count ?? 0;
    const stalled = unfinished.error ? null : (unfinished.count ?? 0);
    const stalledLine = stalled
      ? " " + plural(stalled, "member has", "members have") + " not finished onboarding, so " +
        (stalled === 1 ? "they have" : "they have") + " not reached that step."
      : "";

    if (mailboxes === 0) {
      note.innerHTML = '<div class="ad-msg warn"><strong>No Microsoft 365 mailbox has been created yet.</strong> ' +
        "Creating one is a button a member presses during onboarding — it does not happen on signup, and " +
        'the same step offers "set up later".' + escapeHtml(stalledLine) +
        " If you expected mailboxes by now, check that <code>provision-ms365</code> is deployed: onboarding " +
        "catches a missing function and lets the member carry on without one.</div>";
      return;
    }

    if (delivered === 0) {
      note.innerHTML = '<div class="ad-msg err"><strong>' + plural(mailboxes, "mailbox exists", "mailboxes exist") +
        " and no sign-in email has been recorded for any of them.</strong> " +
        "The accounts are real and their passwords were generated, so those members cannot get in and the " +
        "password is not stored anywhere to resend. Check <code>send-transactional-email</code> is deployed and " +
        "that <code>RESEND_API_KEY</code> is set, then reset the affected mailboxes from Members.</div>";
      return;
    }

    if (delivered < mailboxes) {
      note.innerHTML = '<div class="ad-msg warn"><strong>' + (mailboxes - delivered) + " of " +
        plural(mailboxes, "mailbox", "mailboxes") + " has no sign-in email recorded.</strong> " +
        "Those members have an account they cannot reach; the password is not stored, so it needs resetting " +
        "rather than resending." + escapeHtml(stalledLine) + "</div>";
      return;
    }

    note.innerHTML = '<div class="ad-msg ok">Microsoft 365 is running on its own — ' +
      plural(mailboxes, "mailbox has", "mailboxes have") + " been created and every one has had its sign-in " +
      "details emailed." + escapeHtml(stalledLine) + "</div>";
  }
</script>
<script defer src="../../lib/back-to-top.js?v=8917e84e6a"></script>
</body>
</html>
