<main class="cx-wrap cx-wrap-wide">
  <div class="cx-hero">
    <h1 class="glow-text">Inbox</h1>
    <p>Messages between you and other members. Nobody sees your email address here —
       this is the whole channel.</p>
  </div>

  <div id="page-status"></div>

  <div class="cx-inbox" id="inbox" hidden>
    <div class="cx-pane" id="pane-list">
      <p class="cx-section-title">Conversations</p>
      <div class="cx-threads" id="threads"></div>
    </div>
    <div class="cx-pane cx-is-hidden" id="pane-convo"></div>
  </div>
</main>

<script type="module">
  import {
    requireUser, loadMessages, groupThreads, sendMessage, markRead, hideThread,
    getMember, escapeHtml, initialOf, relativeTime, CONNECT_OFF_MESSAGE,
  } from "../lib/connect.js?v=bf67066856";
  import { supabase } from "../lib/supabase-client.js?v=bf67066856";
  import { markConversationRead, refreshNavBadges } from "../lib/notifications.js?v=bf67066856";

  var pageStatus = document.getElementById("page-status");
  var inboxEl = document.getElementById("inbox");
  var threadsEl = document.getElementById("threads");
  var convoEl = document.getElementById("pane-convo");
  var listPane = document.getElementById("pane-list");

  var me = null;
  var threads = [];
  var people = {};        // user_id -> member_directory row (or null if gone)
  var openWith = null;    // user_id of the thread on screen

  function pageState(title, text, actionsHtml) {
    inboxEl.hidden = true;
    pageStatus.innerHTML =
      '<div class="cx-state">' +
        (title ? '<p class="cx-state-title">' + title + "</p>" : "") +
        '<p class="cx-state-text">' + text + "</p>" +
        (actionsHtml ? '<div class="cx-state-actions">' + actionsHtml + "</div>" : "") +
      "</div>";
  }

  // Someone who has left the directory since writing to you has no name to
  // show. "A member" is honest about that — we can't look them up any more,
  // and member_directory is the only place we're allowed to look.
  function nameOf(userId) {
    var p = people[userId];
    return (p && p.full_name) || "A member";
  }

  function avatarHtml(userId) {
    var p = people[userId];
    if (p && p.avatar_url) {
      return '<img class="cx-avatar cx-avatar-sm" src="' + escapeHtml(p.avatar_url) +
             '" alt="" loading="lazy">';
    }
    // "?" rather than the "A" of "A member", which would read as a real initial.
    var initial = p ? initialOf(p.full_name) : "?";
    return '<span class="cx-avatar cx-avatar-sm cx-avatar-initial" aria-hidden="true">' +
           escapeHtml(initial) + "</span>";
  }

  // ---- Thread list ------------------------------------------------------

  function renderThreads() {
    if (!threads.length) {
      threadsEl.innerHTML =
        '<p class="cx-state-text">No conversations yet.</p>';
      return;
    }
    threadsEl.innerHTML = threads.map(function (t) {
      var last = t.last;
      var prefix = last.sender_id === me.id ? "You: " : "";
      return '<button type="button" class="cx-thread' +
        (t.userId === openWith ? " is-active" : "") +
        '" data-thread="' + escapeHtml(t.userId) + '">' +
        avatarHtml(t.userId) +
        // The inbox is the one surface where two members write free prose to
        // each other, and much of this community writes Arabic — so dir="auto"
        // matters more here than anywhere else in the app. Without it an
        // Arabic preview renders left-to-right with its punctuation thrown to
        // the wrong end. The "You: " prefix is deliberately outside the
        // auto-directed span: it is our word, in English, and letting it
        // decide the direction of an Arabic preview would defeat the point.
        '<span class="cx-thread-body">' +
          '<span class="cx-thread-name" dir="auto">' + escapeHtml(nameOf(t.userId)) + "</span>" +
          '<span class="cx-thread-preview">' + escapeHtml(prefix) +
            '<span dir="auto">' + escapeHtml(last.body) + "</span></span>" +
        "</span>" +
        '<span class="cx-thread-side">' +
          '<span class="cx-thread-time">' + escapeHtml(relativeTime(last.created_at)) + "</span>" +
          (t.unread ? '<span class="cx-unread">' + t.unread + "</span>" : "") +
        "</span>" +
      "</button>";
    }).join("");
  }

  // ---- One conversation -------------------------------------------------

  function findThread(userId) {
    for (var i = 0; i < threads.length; i++) {
      if (threads[i].userId === userId) return threads[i];
    }
    return null;
  }

  function renderConvo() {
    if (!openWith) {
      convoEl.innerHTML =
        '<div class="cx-card"><p class="cx-state-text">Pick a conversation to read it.</p></div>';
      return;
    }

    var thread = findThread(openWith);
    var person = people[openWith];
    var messages = thread ? thread.messages : [];
    // Someone who has since left Connect keeps their side of the conversation
    // readable — it was addressed to you — but can't be written to any more.
    var canReply = Boolean(person && person.accepts_messages);

    var bubbles = messages.length
      ? messages.map(function (m) {
          var mine = m.sender_id === me.id;
          // dir="auto" on the message itself, not on the bubble: the
          // timestamp inside it is ours and always reads left-to-right, and
          // letting it vote on the direction of an Arabic message would be
          // the wrong way round.
          return '<div class="cx-bubble' + (mine ? " is-mine" : "") + '">' +
            '<span dir="auto">' + escapeHtml(m.body) + "</span>" +
            '<span class="cx-bubble-time">' + escapeHtml(relativeTime(m.created_at)) +
            (mine && m.read_at ? " · read" : "") + "</span>" +
          "</div>";
        }).join("")
      : '<p class="cx-state-text">No messages yet. Say hello.</p>';

    var why = "";
    if (!person) {
      why = "This member isn't in Connect any more, so you can't reply.";
    } else if (!person.accepts_messages) {
      why = "This member has switched messages off, so you can't reply.";
    }

    convoEl.innerHTML =
      '<div class="cx-card">' +
        '<div class="cx-convo-head">' +
          '<button type="button" class="cx-icon-btn" id="btn-back">&larr; All</button>' +
          avatarHtml(openWith) +
          '<span class="cx-convo-head-text">' +
            '<span class="cx-convo-title" dir="auto">' + escapeHtml(nameOf(openWith)) + "</span>" +
            (person && person.headline
              ? '<span class="cx-convo-sub" dir="auto">' + escapeHtml(person.headline) + "</span>"
              : "") +
          "</span>" +
          (person ? '<a class="cx-icon-btn" href="member.html?u=' +
            encodeURIComponent(openWith) + '">Profile</a>' : "") +
          (thread ? '<button type="button" class="cx-icon-btn" id="btn-hide">Remove</button>' : "") +
        "</div>" +
        '<div class="cx-convo" id="convo-scroll">' + bubbles + "</div>" +
        (canReply
          ? '<form class="cx-compose" id="send-form">' +
              '<label class="sr-only" for="send-body">Message</label>' +
              '<textarea id="send-body" dir="auto" maxlength="4000" placeholder="Write a message…" required></textarea>' +
              '<button type="submit" class="cx-btn cx-btn-primary" id="btn-send">Send</button>' +
            "</form>"
          : '<p class="cx-note">' + escapeHtml(why) + "</p>") +
        // role="status": a send that fails, or a Connect switched off, is
        // reported only here. Without it the member presses Send, nothing is
        // announced, and the only evidence is a line of text they have no
        // reason to go looking for.
        '<div id="convo-status" role="status"></div>' +
      "</div>";

    var scroll = document.getElementById("convo-scroll");
    if (scroll) scroll.scrollTop = scroll.scrollHeight;

    document.getElementById("btn-back").addEventListener("click", showList);

    var hideBtn = document.getElementById("btn-hide");
    if (hideBtn) hideBtn.addEventListener("click", onHide);

    var form = document.getElementById("send-form");
    if (form) form.addEventListener("submit", onSend);
  }

  function convoStatus(kind, text) {
    var el = document.getElementById("convo-status");
    if (el) el.innerHTML = '<div class="cx-status is-' + kind + '">' + text + "</div>";
  }

  // ---- Phone: one pane at a time ---------------------------------------

  function showConvo() {
    listPane.classList.add("cx-is-hidden");
    convoEl.classList.remove("cx-is-hidden");
  }

  function showList() {
    convoEl.classList.add("cx-is-hidden");
    listPane.classList.remove("cx-is-hidden");
    openWith = null;
    renderThreads();
    renderConvo();
  }

  // ---- Actions ----------------------------------------------------------

  async function openThread(userId) {
    openWith = userId;
    if (!people[userId]) {
      var res = await getMember(userId);
      people[userId] = res.data || null;
    }
    renderThreads();
    renderConvo();
    showConvo();

    var thread = findThread(userId);
    if (thread && thread.unread) {
      var res2 = await markRead(userId);
      if (!res2.error) {
        thread.messages.forEach(function (m) {
          if (m.recipient_id === me.id && !m.read_at) m.read_at = new Date().toISOString();
        });
        thread.unread = 0;
        renderThreads();
      }
    }

    // Clear the menu badge for this conversation too. The message rows and the
    // notification row are separate records of the same event, and leaving one
    // marked read while the other stays unread is how a badge ends up
    // insisting there is something to see on a page the member just read.
    markConversationRead(userId).then(function (n) {
      if (n) refreshNavBadges();
    });
  }

  async function onSend(e) {
    e.preventDefault();
    var box = document.getElementById("send-body");
    var btn = document.getElementById("btn-send");
    var body = box.value;
    // Read before anything is disabled: disabling the button a member pressed
    // already drops focus to <body>, so asking afterwards would always say no.
    var formEl = document.getElementById("send-form");
    var wasInForm = Boolean(formEl && formEl.contains(document.activeElement));
    btn.disabled = true;

    var res = await sendMessage(openWith, body);
    btn.disabled = false;

    if (res.off) { convoStatus("info", CONNECT_OFF_MESSAGE); return; }
    if (res.error) { convoStatus("err", escapeHtml(res.error)); return; }

    box.value = "";
    var thread = findThread(openWith);
    if (!thread) {
      thread = { userId: openWith, messages: [], unread: 0, last: null };
      threads.unshift(thread);
    }
    thread.messages.push(res.data);
    thread.last = res.data;
    threads.sort(function (a, b) {
      return new Date(b.last.created_at) - new Date(a.last.created_at);
    });
    renderThreads();

    // renderConvo() replaces the whole card, textarea included, so the element
    // that had focus stops existing and focus falls to <body>. In a chat that
    // means every message sent costs a keyboard user a fresh hunt for the box
    // they were already typing in. Put them back in it — but only if they were
    // in the compose form to begin with, so nothing is snatched back from
    // someone who tabbed away while the send was in flight.
    renderConvo();
    if (wasInForm) {
      var fresh = document.getElementById("send-body");
      if (fresh) fresh.focus();
    }
  }

  async function onHide() {
    // Deliberately not called "Delete": nothing is destroyed, and the other
    // person's copy is untouched. Saying otherwise would be a lie about what
    // the button does.
    if (!window.confirm(
      "Remove this conversation from your inbox?\n\n" +
      "It disappears for you only — the other member keeps their copy."
    )) return;

    var res = await hideThread(openWith);
    if (res.off) { convoStatus("info", CONNECT_OFF_MESSAGE); return; }
    if (res.error) { convoStatus("err", "Couldn't remove that. Try again in a moment."); return; }

    threads = threads.filter(function (t) { return t.userId !== openWith; });
    showList();
  }

  threadsEl.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-thread]");
    if (btn) openThread(btn.getAttribute("data-thread"));
  });

  // ---- Load -------------------------------------------------------------

  // ---- Live messages ----------------------------------------------------
  //
  // Send "hi", get the reply without touching the page. Supabase Realtime
  // pushes the row; nothing here polls.
  //
  // Realtime authorises `postgres_changes` against RLS, and 0013's policy on
  // member_messages is "only the two parties" — so this subscription can only
  // ever deliver rows this member could already have SELECTed. The two filters
  // below narrow what crosses the wire; they are NOT the access control, and
  // removing them would change efficiency rather than privacy.
  //
  // Two subscriptions, because a `postgres_changes` filter takes one condition
  // and a conversation has two directions:
  //   recipient_id — the reply arriving, which is the whole point;
  //   sender_id    — the same member typing on their phone while this tab is
  //                  open on their laptop, which otherwise silently diverges.
  var channel = null;

  function startRealtime() {
    if (!me || channel) return;

    function handler(payload) { onIncoming(payload.new); }

    channel = supabase
      .channel("sc-inbox-" + me.id)
      .on("postgres_changes", {
        event: "INSERT", schema: "public", table: "member_messages",
        filter: "recipient_id=eq." + me.id,
      }, handler)
      .on("postgres_changes", {
        event: "INSERT", schema: "public", table: "member_messages",
        filter: "sender_id=eq." + me.id,
      }, handler)
      .subscribe();
  }

  async function onIncoming(msg) {
    if (!msg || !msg.id || !me) return;

    var otherId = msg.sender_id === me.id ? msg.recipient_id : msg.sender_id;
    var thread = findThread(otherId);
    if (!thread) {
      thread = { userId: otherId, messages: [], unread: 0, last: null };
      threads.push(thread);
    }

    // ⚠ Dedupe by id, always. onSend() already appends the row it got back
    // from the insert, and the sender_id subscription then delivers that same
    // row a moment later — without this every message you send appears twice
    // in your own thread.
    if (thread.messages.some(function (m) { return m.id === msg.id; })) return;

    thread.messages.push(msg);
    thread.last = msg;

    // Arriving into the thread already on screen counts as read; arriving into
    // any other thread is a new unread. Marking read here keeps the badge, the
    // list and the open conversation from disagreeing with each other.
    if (msg.recipient_id === me.id && !msg.read_at) {
      if (openWith === otherId) {
        var res = await markRead(otherId);
        if (!res.error) msg.read_at = new Date().toISOString();
      } else {
        thread.unread = (thread.unread || 0) + 1;
      }
    }

    // A first-ever message comes from somebody not yet in the people map.
    if (!people[otherId]) {
      var found = await getMember(otherId);
      people[otherId] = found.data || null;
    }

    threads.sort(function (a, b) {
      return new Date(b.last.created_at) - new Date(a.last.created_at);
    });

    // The member may be sitting on the "No messages yet" state, which returns
    // early from init() with the inbox still hidden. Their first message must
    // replace that rather than arrive behind it.
    if (inboxEl.hidden) {
      inboxEl.hidden = false;
      pageStatus.innerHTML = "";
    }

    renderThreads();
    if (openWith === otherId) renderConvo();
  }

  window.addEventListener("pagehide", function () {
    if (!channel) return;
    try { supabase.removeChannel(channel); } catch (e) {}
    channel = null;
  });

  (async function init() {
    me = await requireUser("../login.html");
    if (!me) return;

    var msgs = await loadMessages();
    if (msgs.off) {
      pageState("Connect isn't switched on yet", CONNECT_OFF_MESSAGE,
        '<a class="cx-btn" href="dashboard.html">Back to dashboard</a>');
      return;
    }
    if (msgs.error) {
      pageState("Couldn't load your messages",
        "Something went wrong on the way to the server. Refreshing usually sorts it.");
      return;
    }

    threads = groupThreads(msgs.data, me.id);

    // Started here, BEFORE the empty-state branch below returns early. A
    // member with no messages is exactly the member most likely to receive
    // their first one while looking at the page.
    startRealtime();

    // Someone arriving from a "Message" button. Their thread may not exist
    // yet, which is fine — an empty one is a compose box.
    var startWith = new URLSearchParams(window.location.search).get("to");
    if (startWith === me.id) startWith = null;

    if (!threads.length && !startWith) {
      pageState("No messages yet",
        "When a member writes to you it lands here. To start one yourself, " +
        "find someone in Connect and use the Message button on their profile.",
        '<a class="cx-btn cx-btn-primary" href="connect.html">Browse Connect</a>');
      return;
    }

    // Names and photos for everyone in the list, one lookup each — but all at
    // once. These were awaited in a `for` loop, so twenty threads meant twenty
    // serialized round trips before the inbox appeared at all; they do not
    // depend on each other, so nothing was being bought with the wait. A
    // member who has since left the directory comes back null and is handled
    // as such, and one failed lookup must not take the others down with it,
    // which is why each result is unwrapped on its own rather than by
    // destructuring a settled array.
    var ids = threads.map(function (t) { return t.userId; });
    if (startWith && ids.indexOf(startWith) === -1) ids.push(startWith);
    var found = await Promise.all(ids.map(function (id) {
      return getMember(id).then(
        function (res) { return res.data || null; },
        function () { return null; }
      );
    }));
    ids.forEach(function (id, i) { people[id] = found[i]; });

    inboxEl.hidden = false;
    pageStatus.innerHTML = "";
    renderThreads();
    renderConvo();

    if (startWith) {
      if (!people[startWith]) {
        pageStatus.innerHTML =
          '<div class="cx-status is-info">That member isn\'t in Connect, so you can\'t message them.</div>';
      } else {
        openThread(startWith);
      }
    }
  })();
</script>
