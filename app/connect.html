<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect — Sahaba Club</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="connect.css">
<script>
  try {
    if (localStorage.getItem("sc_light_mode") === "1") {
      document.documentElement.classList.add("light-mode");
    }
  } catch (e) {}
</script>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="nebula-bg" aria-hidden="true"></div>
<div class="noise-bg" aria-hidden="true"></div>

<header class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="logo" aria-label="Sahaba Club — home">
      <img src="../assets/logo.png" class="logo-img logo-img-dark" alt="Sahaba Club" width="185" height="120">
      <img src="../assets/logo-light.png" class="logo-img logo-img-light" alt="" aria-hidden="true" width="185" height="120">
    </a>
    <div class="nav-actions">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="inbox.html" class="nav-link">Inbox</a>
      <a href="../events.html" class="nav-link">Events</a>
    </div>
  </div>
</header>

<main class="cx-wrap cx-wrap-wide">
  <div class="cx-hero">
    <h1 class="glow-text">Connect</h1>
    <p>The members who've chosen to be found, and the people from EduHackAI whose
       history the club has kept for them. Nearest to you first: teammates, then the
       rounds you shared, then what you have in common.</p>
  </div>

  <div id="self-note"></div>

  <div class="cx-filters" id="filters" hidden>
    <label class="sr-only" for="q">Search people</label>
    <input class="cx-input" type="search" id="q" placeholder="Search name, headline, or skill" autocomplete="off">
    <div class="cx-select-row">
      <label class="sr-only" for="f-kind">Members or not yet joined</label>
      <select class="cx-select" id="f-kind">
        <option value="">Everyone</option>
        <option value="member">Members</option>
        <option value="prospect">Not joined yet</option>
      </select>
      <label class="sr-only" for="f-country">Country</label>
      <select class="cx-select" id="f-country"><option value="">Any country</option></select>
      <label class="sr-only" for="f-industry">Industry</label>
      <select class="cx-select" id="f-industry"><option value="">Any industry</option></select>
      <label class="sr-only" for="f-experience">Experience level</label>
      <select class="cx-select" id="f-experience"><option value="">Any experience</option></select>
      <label class="sr-only" for="f-topic">Topic</label>
      <select class="cx-select" id="f-topic"><option value="">Any topic</option></select>
    </div>
  </div>

  <p class="cx-count" id="count" hidden></p>
  <div id="results">
    <div class="cx-state"><p class="cx-state-text">Loading members…</p></div>
  </div>
</main>

<script type="module">
  import {
    requireUser, listConnect, getActivityFor, myFollowing, follow, unfollow,
    shortSummary, escapeHtml, initialOf, placeOf, experienceLabel,
    subjectHref, relevanceLabel,
    CONNECT_OFF_MESSAGE, DIRECTORY_CAP,
  } from "../lib/connect.js";

  var results = document.getElementById("results");
  var countEl = document.getElementById("count");
  var filtersEl = document.getElementById("filters");
  var me = null;
  // Everyone on the page, members and prospects alike, in one array of one
  // shape. 0027 gives the two views the same aggregate shape on purpose and
  // 0028 unions them, so branching per row belongs in the few places where a
  // prospect genuinely has no equivalent — a follow button, a message, an
  // event history — and nowhere else.
  var people = [];
  var activity = {};
  var followingSet = new Set();
  var ranked = false;

  function state(title, text, actionsHtml) {
    results.innerHTML =
      '<div class="cx-state">' +
        (title ? '<p class="cx-state-title">' + title + "</p>" : "") +
        '<p class="cx-state-text">' + text + "</p>" +
        (actionsHtml ? '<div class="cx-state-actions">' + actionsHtml + "</div>" : "") +
      "</div>";
  }

  // ---- Filters ----------------------------------------------------------

  function fillSelect(id, values, keepFirst) {
    var sel = document.getElementById(id);
    var current = sel.value;
    sel.innerHTML = '<option value="">' + keepFirst + "</option>" +
      values.map(function (v) {
        return '<option value="' + escapeHtml(v.value) + '">' + escapeHtml(v.label) + "</option>";
      }).join("");
    sel.value = current;
  }

  // Options come from the members actually on screen, so nobody can pick a
  // filter that returns nothing.
  function buildFilters() {
    var countries = {}, industries = {}, levels = {}, topics = {};
    people.forEach(function (m) {
      if (m.country) countries[m.country] = true;
      if (m.industry) industries[m.industry] = true;
      if (m.experience_level) levels[m.experience_level] = true;
      ((activityOf(m) && activityOf(m).top_topics) || []).forEach(function (t) {
        if (t) topics[t] = true;
      });
    });
    var plain = function (o) {
      return Object.keys(o).sort(function (a, b) { return a.localeCompare(b); })
        .map(function (v) { return { value: v, label: v }; });
    };
    fillSelect("f-country", plain(countries), "Any country");
    fillSelect("f-industry", plain(industries), "Any industry");
    fillSelect("f-experience",
      Object.keys(levels).sort().map(function (v) {
        return { value: v, label: experienceLabel(v) };
      }), "Any experience");
    fillSelect("f-topic", plain(topics), "Any topic");
    filtersEl.hidden = false;
  }

  function matches(m) {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var kind = document.getElementById("f-kind").value;
    var country = document.getElementById("f-country").value;
    var industry = document.getElementById("f-industry").value;
    var level = document.getElementById("f-experience").value;
    var topic = document.getElementById("f-topic").value;

    if (kind === "member" && !m.is_member) return false;
    if (kind === "prospect" && m.is_member) return false;
    if (country && m.country !== country) return false;
    if (industry && m.industry !== industry) return false;
    if (level && m.experience_level !== level) return false;
    if (topic) {
      // Topics come from attended events, so a prospect can never match one —
      // they have no account to have attended anything with.
      var list = (activityOf(m) && activityOf(m).top_topics) || [];
      if (list.indexOf(topic) === -1) return false;
    }
    if (!q) return true;

    var haystack = [
      m.full_name, m.headline, m.industry, m.city, m.country,
      (m.skills || []).join(" "), (m.interests || []).join(" "),
    ].filter(Boolean).join(" ").toLowerCase();
    // Every word has to appear somewhere — "ai dubai" should mean both.
    return q.split(/\s+/).every(function (word) { return haystack.indexOf(word) !== -1; });
  }

  // ---- Cards ------------------------------------------------------------

  function avatarHtml(m) {
    if (m.avatar_url) {
      return '<img class="cx-avatar cx-avatar-sm" src="' + escapeHtml(m.avatar_url) +
             '" alt="" loading="lazy">';
    }
    return '<span class="cx-avatar cx-avatar-sm cx-avatar-initial" aria-hidden="true">' +
           escapeHtml(initialOf(m.full_name)) + "</span>";
  }

  // A prospect has no account, so nothing that needs one is drawn for them:
  // no Follow, no Message, no follower counts, no "accepts messages". Those
  // all resolve to a `user_id` that does not exist, and a greyed-out Follow
  // button would read as a member who has blocked you rather than as a person
  // who has not arrived. What they get instead is the plain fact, said once.
  function cardHtml(m) {
    var act = activityOf(m);
    var topics = (act && act.top_topics) || [];
    var place = placeOf(m);
    var sub = m.is_member
      ? [shortSummary(m, act), place].filter(Boolean).join(" · ")
      : place;
    var isMe = me && m.is_member && m.member_user_id === me.id;
    var href = subjectHref(m);
    var rel = relevanceLabel(m.relevance);

    // Their own skills stand in for the topic chips a prospect cannot have.
    // Plain tags, not the accent the topic chips use — that accent means
    // "derived from events they actually turned up to", which this is not.
    var chips = m.is_member
      ? topics.slice(0, 3).map(function (t) {
          return '<span class="cx-tag cx-tag-topic">' + escapeHtml(t) + "</span>";
        })
      : (m.skills || []).filter(Boolean).slice(0, 3).map(function (t) {
          return '<span class="cx-tag">' + escapeHtml(t) + "</span>";
        });

    var flags = "";
    if (rel) flags += '<span class="cx-rel">' + escapeHtml(rel) + "</span>";
    if (!m.is_member) flags += '<span class="cx-notyet">Hasn’t joined yet</span>';

    return '<article class="cx-member' + (m.is_member ? "" : " is-notyet") + '">' +
      '<a class="cx-member-link" href="' + href + '">' +
        avatarHtml(m) +
        '<div class="cx-member-body">' +
          '<p class="cx-member-name">' + escapeHtml(m.full_name || (m.is_member ? "Member" : "Someone from EduHackAI")) +
            (isMe ? " (you)" : "") + "</p>" +
          (m.headline ? '<p class="cx-member-headline">' + escapeHtml(m.headline) + "</p>" : "") +
          (sub ? '<p class="cx-member-sub">' + escapeHtml(sub) + "</p>" : "") +
        "</div>" +
      "</a>" +
      (flags ? '<div class="cx-flags">' + flags + "</div>" : "") +
      (chips.length ? '<div class="cx-tags">' + chips.join("") + "</div>" : "") +
      '<div class="cx-member-foot">' +
        '<a class="cx-btn cx-btn-sm" href="' + href + '">View profile</a>' +
        (m.is_member && !isMe ? followButtonHtml(m.member_user_id) : "") +
      "</div>" +
    "</article>";
  }

  function followButtonHtml(userId) {
    var on = followingSet.has(userId);
    return '<button type="button" class="cx-btn cx-btn-sm' + (on ? " is-on" : "") +
      '" data-follow="' + escapeHtml(userId) + '" aria-pressed="' + (on ? "true" : "false") +
      '">' + (on ? "Following" : "Follow") + "</button>";
  }

  function countText(shown) {
    var noun = shown === 1 ? " person" : " people";
    var head = shown === people.length
      ? people.length + noun
      : shown + " of " + people.length + " people";
    // Only claim an order when there is one. Without 0028 the list is the old
    // newest-first, and captioning that as "closest to you first" would be a
    // straightforwardly false statement about what the reader is looking at.
    return ranked ? head + " · closest to you first" : head;
  }

  function render() {
    var shown = people.filter(matches);
    countEl.hidden = false;
    countEl.textContent = countText(shown.length);

    if (!shown.length) {
      state("Nobody matches that",
        "Try fewer words, or clear a filter.",
        '<button type="button" class="cx-btn" id="btn-clear">Clear filters</button>');
      var clear = document.getElementById("btn-clear");
      if (clear) clear.addEventListener("click", function () {
        document.getElementById("q").value = "";
        FILTER_IDS.forEach(function (id) { document.getElementById(id).value = ""; });
        render();
      });
      return;
    }
    results.innerHTML = '<div class="cx-grid">' + shown.map(cardHtml).join("") + "</div>";
  }

  results.addEventListener("click", async function (e) {
    var btn = e.target.closest("[data-follow]");
    if (!btn) return;
    var userId = btn.getAttribute("data-follow");
    var on = followingSet.has(userId);
    btn.disabled = true;
    var res = on ? await unfollow(userId) : await follow(userId);
    btn.disabled = false;
    if (res.off || res.error) {
      btn.textContent = "Try again";
      return;
    }
    if (on) followingSet.delete(userId); else followingSet.add(userId);
    var nowOn = followingSet.has(userId);
    btn.textContent = nowOn ? "Following" : "Follow";
    btn.className = "cx-btn cx-btn-sm" + (nowOn ? " is-on" : "");
    btn.setAttribute("aria-pressed", nowOn ? "true" : "false");
  });

  var FILTER_IDS = ["f-kind", "f-country", "f-industry", "f-experience", "f-topic"];

  ["q"].concat(FILTER_IDS).forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  // ---- Load -------------------------------------------------------------

  // Event history is keyed on user_id and a prospect has none, so this is the
  // one lookup that has to know which kind of row it was handed.
  function activityOf(m) {
    return m && m.is_member ? activity[m.member_user_id] : null;
  }

  (async function init() {
    me = await requireUser("../login.html");
    if (!me) return;

    var dir = await listConnect();
    if (dir.off) {
      state("Connect isn't switched on yet", CONNECT_OFF_MESSAGE,
        '<a class="cx-btn" href="dashboard.html">Back to dashboard</a>');
      return;
    }
    if (dir.error) {
      state("Couldn't load the directory",
        "Something went wrong on the way to the server. Refreshing usually sorts it.");
      return;
    }

    people = dir.data || [];
    ranked = dir.ranked === true;

    // Nobody has opted in yet — including, most likely, the person reading
    // this. That's the moment to ask.
    if (!people.length) {
      state("Nobody's here yet",
        "Connect only lists members who've chosen to appear, and so far nobody has. " +
        "Be the first: switch on <strong>Show me in Connect</strong> on your profile and " +
        "other members will be able to find you, follow you, and send you a message.",
        '<a class="cx-btn cx-btn-primary" href="profile.html">Open my profile</a>');
      return;
    }

    var act = await getActivityFor(
      people.filter(function (m) { return m.is_member; })
            .map(function (m) { return m.member_user_id; })
    );
    activity = act.data || {};
    var fol = await myFollowing();
    followingSet = fol.data;

    buildFilters();
    render();

    // If the reader isn't in their own directory, say so once, quietly — they
    // can browse either way, but they can't be found back.
    var inDirectory = people.some(function (m) {
      return m.is_member && m.member_user_id === me.id;
    });
    if (!inDirectory) {
      document.getElementById("self-note").innerHTML =
        '<div class="cx-status is-info">You\'re not listed here yet. ' +
        'Switch on <strong>Show me in Connect</strong> on your ' +
        '<a href="profile.html">profile</a> so other members can find you too.</div>';
    }

    if (dir.capped) {
      document.getElementById("self-note").insertAdjacentHTML("beforeend",
        '<div class="cx-status is-info">Showing the first ' + DIRECTORY_CAP +
        " people. Search and filters apply to those.</div>");
    }
  })();
</script>
<script src="../script.js"></script>
</body>
</html>
