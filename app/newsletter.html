  try {
    if (localStorage.getItem("sc_light_mode") === "1") {
      document.documentElement.classList.add("light-mode");
    }
  } catch (e) {}

<style>
  .nl-wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 100px; }
  .nl-hero { margin-bottom: 24px; }
  .nl-hero h1 { font-size: 26px; margin: 0 0 6px; }
  .nl-hero p { color: var(--text-secondary); font-size: 14.5px; margin: 0; }
  .nl-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 24px; }
  .nl-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .nl-field label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .nl-field input, .nl-field textarea {
    background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .nl-field textarea { min-height: 180px; resize: vertical; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
  .nl-hidden { display: none !important; }
  .nl-status { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-top: 14px; }
  .nl-status.ok { background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.4); color: #4ade80; }
  .nl-status.err { background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
  .nl-status.info { background: rgba(56,189,248,0.14); border: 1px solid rgba(56,189,248,0.4); color: #7dd3fc; }
  /* Dark-theme status ink is unreadable on the light card. */
  html.light-mode .nl-status.ok { color: #166534; }
  html.light-mode .nl-status.err { color: #b91c1c; }
  html.light-mode .nl-status.info { color: #155e75; }
  .nl-btn-primary {
    background: linear-gradient(135deg, var(--violet), var(--cyan)); border: none; color: #05070d;
    font-weight: 700; border-radius: 999px; cursor: pointer; padding: 11px 22px; font-size: 14.5px; font-family: inherit;
  }
  /* The light theme swaps --violet/--cyan for #6d28d9/#0e7490, so the
     near-black label on this gradient falls to 2.83:1. White is 5.36:1 at
     the worst (cyan) stop. */
  html.light-mode .nl-btn-primary { color: #fff; }
  .nl-btn-secondary { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); border-radius: 999px; cursor: pointer; padding: 10px 20px; font-size: 14px; font-family: inherit; }
  .nl-btn-primary:disabled, .nl-btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .nl-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .nl-note { font-size: 12.5px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>

<div class="nebula-bg" aria-hidden="true"></div>

    </div>

</header>

<main class="nl-wrap">
  <div class="nl-hero">
    <p class="kicker">Private tool</p>
    <h1 class="glow-text">Send a newsletter</h1>
    <p>Goes only to members who've opted in. Check the audience before you send — there's no unsend.</p>
  </div>

  <div id="gate-status"></div>

  <div class="nl-card nl-hidden" id="composer">
    <div class="nl-field">
      <label for="f-interests">Audience — interests (comma-separated, blank for everyone)</label>
      <input type="text" id="f-interests" placeholder="Agentic AI, Hackathons">
    </div>

    <div class="nl-actions" style="margin-bottom:18px;">
      <button type="button" class="nl-btn-secondary" id="btn-count">Check audience size</button>
      <span id="count-result" style="font-size:13.5px; color:var(--text-secondary);"></span>
    </div>

    <div class="nl-field">
      <label for="f-subject">Subject</label>
      <input type="text" id="f-subject" placeholder="What's on at Sahaba Club this month">
    </div>

    <div class="nl-field">
      <label for="f-html">Body (HTML)</label>
      <textarea id="f-html" placeholder="&lt;p&gt;Hi,&lt;/p&gt;&#10;&lt;p&gt;Here's what's coming up…&lt;/p&gt;"></textarea>
    </div>

    <div class="nl-actions">
      <button type="button" class="nl-btn-primary" id="btn-send">Send newsletter</button>
    </div>
    <div id="send-status"></div>
    <p class="nl-note">Every recipient gets their own email — nobody sees anyone else's address.</p>
  </div>
</main>

<script type="module">
  import { supabase } from "../lib/supabase-client.js?v=1696b16761";
  import { getSession } from "../lib/auth.js?v=1696b16761";

  function showStatus(elId, msg, kind) {
    document.getElementById(elId).innerHTML = '<div class="nl-status ' + kind + '">' + msg + "</div>";
  }

  function targetInterests() {
    return document.getElementById("f-interests").value
      .split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  }

  (async function init() {
    var session = await getSession();
    if (!session) {
      window.location.href = "../login.html";
      return;
    }

    // The function enforces this too — this check only decides whether to
    // show the composer, so a non-admin gets a clear message instead of a
    // form that fails on submit.
    var { data } = await supabase
      .from("profiles")
      .select("role")
      .eq("user_id", session.user.id)
      .maybeSingle();

    // ⚠ `global_admin` too. 0054 renamed Ahmed's role, and this line refused
    // the only person the newsletter tool is for — the dashboard link to it
    // was hidden by the same omission, so the refusal was not even reachable
    // to notice. tools/check-role-labels.mjs found this one, not a human.
    if (!data || (data.role !== "admin" && data.role !== "global_admin")) {
      showStatus("gate-status", "This page is for admins only.", "err");
      return;
    }
    document.getElementById("composer").classList.remove("nl-hidden");
  })();

  document.getElementById("btn-count").addEventListener("click", async function () {
    var countEl = document.getElementById("count-result");
    countEl.textContent = "Counting…";

    var { data, error } = await supabase.functions.invoke("send-newsletter", {
      body: { interests: targetInterests(), dryRun: true },
    });

    if (error || (data && data.error)) {
      countEl.textContent = (data && data.error) || error.message;
      return;
    }
    countEl.textContent = data.reachable + " will receive it" +
      (data.matched !== data.reachable
        ? " (" + (data.matched - data.reachable) + " matched but have no email address)"
        : "");
  });

  document.getElementById("btn-send").addEventListener("click", async function () {
    var subject = document.getElementById("f-subject").value.trim();
    var html = document.getElementById("f-html").value.trim();
    if (!subject || !html) {
      showStatus("send-status", "Add a subject and a body first.", "err");
      return;
    }

    var interests = targetInterests();
    var audience = interests.length ? "members interested in " + interests.join(", ") : "every opted-in member";
    if (!confirm('Send "' + subject + '" to ' + audience + "?\n\nThis can't be undone.")) return;

    var sendBtn = document.getElementById("btn-send");
    sendBtn.disabled = true;
    showStatus("send-status", "Sending…", "info");

    var { data, error } = await supabase.functions.invoke("send-newsletter", {
      body: { subject: subject, html: html, interests: interests },
    });

    sendBtn.disabled = false;
    if (error || (data && data.error)) {
      showStatus("send-status", (data && data.error) || error.message, "err");
      return;
    }
    showStatus("send-status",
      "Sent to " + data.sent + " members." + (data.failed ? " " + data.failed + " didn't go through — check the function logs." : ""),
      data.failed ? "info" : "ok");
  });
</script>
<script src="../script.js?v=1696b16761"></script>
</body>
</html>
